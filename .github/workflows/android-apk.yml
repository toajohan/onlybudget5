name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, main-fei8xp]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same Flutter version the project was created with, so pubspec.lock resolves unchanged.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/onlybudget.apk

      # A release (not just an artifact) gives a direct .apk link that downloads straight onto a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OnlyBudget Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: mobile/build/onlybudget.apk
          body: |
            APK compilé automatiquement depuis le commit ${{ github.sha }}.
            Sur le téléphone : télécharger onlybudget.apk, l'ouvrir, autoriser l'installation depuis cette source.
