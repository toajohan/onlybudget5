org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The project (D:) and the pub cache (C:) are on different drives: Kotlin's incremental compiler crashes computing
# a relative path across drive roots (IllegalArgumentException: "this and base files have different roots").
# Incremental compilation is a local developer-machine speedup only — disabling it avoids that crash entirely.
kotlin.incremental=false
